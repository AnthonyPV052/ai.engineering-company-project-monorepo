[project]
name = "brasaland-mcp-server"
version = "0.1.0"
description = "Brasaland MCP Server — exposes Incidents Manager and Inventory as authenticated MCP tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "python-jose[cryptography]>=3.5.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]